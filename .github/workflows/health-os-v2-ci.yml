name: Health OS v2 quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run check
      - name: Static security lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Release build invariants
        run: npm run build
